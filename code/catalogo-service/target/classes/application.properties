server.port=8082
spring.application.name=catalogo-service

# Apagado ordenado: Kubernetes manda SIGTERM y el servicio termina las peticiones en curso
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# -----------------------------------------------------------------
# BASE DE DATOS
# URL y usuario tienen valor por defecto para desarrollo local.
# La CONTRASEÑA no está en el código: se recibe por variable de entorno
# SPRING_DATASOURCE_PASSWORD (la misma que ya usa el Deployment de Kubernetes).
# -----------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/catalogo_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:bootcamp_user}

# 'update' se mantiene por ahora; lo reemplazaremos con migraciones (Flyway)
spring.jpa.hibernate.ddl-auto=update
# Evita consultas a la BD fuera de la transacción del servicio (anti-patrón Open Session in View)
spring.jpa.open-in-view=false

# Datos iniciales (data.sql) después de que Hibernate crea las tablas
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# -----------------------------------------------------------------
# LOGS (JSON vía logback-spring.xml -> Loki)
# Se quitaron: show-sql (imprimía fuera del JSON) y BasicBinder=TRACE
# (escribía en los logs los VALORES de cada consulta: riesgo de fuga de datos).
# -----------------------------------------------------------------
logging.level.root=INFO
logging.level.com.bootcamp.catalogo=${LOG_LEVEL_APP:INFO}

# -----------------------------------------------------------------
# ACTUATOR (puerto interno 8091, no expuesto en el Ingress)
# -----------------------------------------------------------------
management.server.port=8091
management.endpoints.web.exposure.include=health,prometheus
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Sondas para Kubernetes: /actuator/health/liveness y /actuator/health/readiness
# (la propiedad correcta es management.ENDPOINT.health.probes.enabled)
management.endpoint.health.probes.enabled=true
# Readiness también verifica la base de datos: sin BD, no recibe tráfico
management.endpoint.health.group.readiness.include=readinessState,db
# No exponer detalles internos (versión de BD, espacio en disco) sin autenticación
management.endpoint.health.show-details=never

# -----------------------------------------------------------------
# TRAZAS (OpenTelemetry -> Jaeger)
# -----------------------------------------------------------------
management.tracing.sampling.probability=${TRACING_SAMPLING:1.0}
management.otlp.tracing.endpoint=${OTEL_TRACES_ENDPOINT:http://jaeger.herramientas.svc.cluster.local:4318/v1/traces}