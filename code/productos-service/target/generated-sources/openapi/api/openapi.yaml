openapi: 3.0.3
info:
  contact:
    name: Bootcamp EspecializATT
  description: |
    Microservicio interno que administra el catálogo de productos y su inventario.
    CONTRATO PRIMERO: este archivo es la fuente de verdad. Las interfaces y DTOs
    de Java se generan a partir de él; el código sólo implementa lo que aquí se define.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  title: API de Catálogo e Inventario
  version: 1.1.0
servers:
- description: Kubernetes (red interna del clúster)
  url: http://catalogo-service.apps.svc.cluster.local:8082
- description: Desarrollo local
  url: http://localhost:8082
tags:
- description: Consulta de productos e inventario
  name: Catalog
paths:
  /api/catalog:
    get:
      operationId: listCatalog
      parameters:
      - description: "Número de página, empieza en 0"
        explode: true
        in: query
        name: page
        required: false
        schema:
          default: 0
          format: int32
          minimum: 0
          type: integer
        style: form
      - description: Elementos por página (máximo 100)
        explode: true
        in: query
        name: size
        required: false
        schema:
          default: 20
          format: int32
          maximum: 100
          minimum: 1
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogPage'
          description: Página de productos del catálogo
        "400":
          content:
            application/problem+json:
              example:
                type: about:blank
                title: Bad Request
                status: 400
                detail: productId debe ser mayor o igual a 1
                instance: /api/catalog/0
              schema:
                $ref: '#/components/schemas/Problem'
          description: "Parámetros inválidos (por ejemplo, productId menor a 1)"
      summary: Listar los productos del catálogo (paginado)
      tags:
      - Catalog
      x-accepts: application/json
  /api/catalog/{productId}:
    get:
      operationId: getCatalogByProductId
      parameters:
      - description: Identificador del producto (entero positivo)
        example: 1
        explode: false
        in: path
        name: productId
        required: true
        schema:
          format: int64
          minimum: 1
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogResponse'
          description: Producto encontrado en el catálogo
        "400":
          content:
            application/problem+json:
              example:
                type: about:blank
                title: Bad Request
                status: 400
                detail: productId debe ser mayor o igual a 1
                instance: /api/catalog/0
              schema:
                $ref: '#/components/schemas/Problem'
          description: "Parámetros inválidos (por ejemplo, productId menor a 1)"
        "404":
          content:
            application/problem+json:
              example:
                type: about:blank
                title: Not Found
                status: 404
                detail: No existe el producto con ID 999
                instance: /api/catalog/999
              schema:
                $ref: '#/components/schemas/Problem'
          description: El producto no existe en el catálogo
      summary: Obtener detalle e inventario de un producto
      tags:
      - Catalog
      x-accepts: application/json
components:
  parameters:
    Page:
      description: "Número de página, empieza en 0"
      explode: true
      in: query
      name: page
      required: false
      schema:
        default: 0
        format: int32
        minimum: 0
        type: integer
      style: form
    Size:
      description: Elementos por página (máximo 100)
      explode: true
      in: query
      name: size
      required: false
      schema:
        default: 20
        format: int32
        maximum: 100
        minimum: 1
        type: integer
      style: form
  responses:
    BadRequest:
      content:
        application/problem+json:
          example:
            type: about:blank
            title: Bad Request
            status: 400
            detail: productId debe ser mayor o igual a 1
            instance: /api/catalog/0
          schema:
            $ref: '#/components/schemas/Problem'
      description: "Parámetros inválidos (por ejemplo, productId menor a 1)"
    NotFound:
      content:
        application/problem+json:
          example:
            type: about:blank
            title: Not Found
            status: 404
            detail: No existe el producto con ID 999
            instance: /api/catalog/999
          schema:
            $ref: '#/components/schemas/Problem'
      description: El producto no existe en el catálogo
  schemas:
    CatalogResponse:
      example:
        productId: 1
        name: Laptop Pro 14
        stock: 15
        basePrice: 25000.0
      properties:
        productId:
          example: 1
          format: int64
          type: integer
        name:
          example: Laptop Pro 14
          maxLength: 120
          minLength: 1
          type: string
        basePrice:
          description: "Precio base en MXN, con 2 decimales"
          example: 25000.0
          minimum: 0
          type: number
        stock:
          example: 15
          format: int32
          minimum: 0
          type: integer
      required:
      - basePrice
      - name
      - productId
      - stock
      type: object
    CatalogPage:
      example:
        size: 20
        totalPages: 1
        page: 0
        items:
        - productId: 1
          name: Laptop Pro 14
          stock: 15
          basePrice: 25000.0
        - productId: 1
          name: Laptop Pro 14
          stock: 15
          basePrice: 25000.0
        totalElements: 3
      properties:
        items:
          items:
            $ref: '#/components/schemas/CatalogResponse'
          type: array
        page:
          example: 0
          format: int32
          type: integer
        size:
          example: 20
          format: int32
          type: integer
        totalElements:
          example: 3
          format: int64
          type: integer
        totalPages:
          example: 1
          format: int32
          type: integer
      required:
      - items
      - page
      - size
      - totalElements
      - totalPages
      type: object
    Problem:
      description: Error con formato estándar RFC 9457 (Problem Details for HTTP APIs)
      properties:
        type:
          example: about:blank
          type: string
        title:
          example: Not Found
          type: string
        status:
          example: 404
          format: int32
          type: integer
        detail:
          example: No existe el producto con ID 999
          type: string
        instance:
          example: /api/catalog/999
          type: string
      type: object

